# tmp/ is git-ignored scratch space (it can hold whole cargo target dirs).
exclude = ["config/**", "target/**", "tmp/**", "**/target/**", "**/node_modules/**", "**/Cargo.toml"]
include = ["**/*.toml"]

[formatting]
reorder_keys = false
column_width = 120

[[rule]]
include = ["**/Cargo.toml"]
keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "features",
  "target.*.dependencies",
  "target.*.dev-dependencies",
  "target.*.build-dependencies",
  "workspace.dependencies",
]

[rule.formatting]
reorder_keys = false
array_auto_collapse = false
