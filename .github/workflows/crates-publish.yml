# Crates.io publishing workflow for eulumdat crates
#
# Triggered on every `v*` tag push. Publishes the workspace's publishable
# crates to crates.io in topological dependency order, with sleeps after
# foundation crates so crates.io's index can update before dependents
# resolve their peer versions.
#
# Crates flagged `publish = false` (see crates/*/Cargo.toml) are
# intentionally excluded:
#   - eulumdat-bevy / eulumdat-bevy-rt — depend on a Bevy git fork
#     (`holg/bevy.git#photometric_proposal`); crates.io rejects git deps.
#     Restore once the photometric proposal merges into upstream Bevy.
#   - eulumdat-dev-server — internal dev tooling.
#   - eulumdat-harmonyos-ffi — HarmonyOS native cdylib, distributed as a
#     binary, not a Rust library.
#   - eulumdat-wasm-quiz / eulumdat-wasm-street / eulumdat-wasm-templates
#     — Leptos / WASM bundle apps, distributed as JS, not Rust libraries.
#
# Workflow design:
# - Each `cargo publish` is best-effort: if a version is already on
#   crates.io it logs "already published" and continues. This makes the
#   workflow idempotent — re-running for the same tag is safe.
# - We don't pre-build the whole workspace (slow, redundant with publish
#   verify). Each `cargo publish` does its own packaging + verify.

name: Crates.io Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Linux deps for the egui-based crates' verify step.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      # Sanity-check that the publishable set still tests green before we
      # touch crates.io. Skip py/wasm/windows crates whose verify step
      # would need a non-Linux target or a non-stable toolchain.
      - name: Run tests on the core publishable set
        run: |
          cargo test \
            -p eulumdat \
            -p eulumdat-i18n \
            -p eulumdat-quiz \
            -p eulumdat-photweb \
            -p eulumdat-goniosim \
            -p eulumdat-typst \
            -p eulumdat-ui \
            -p eulumdat-plugin \
            -p eulumdat-rt \
            -p eulumdat-ffi \
            -p eulumdat-egui \
            -p eulumdat-tui \
            -p eulumdat-tui-quiz \
            -p eulumdat-cli

      # ─── Tier 1: leaves with no internal deps ────────────────────────
      - name: Publish eulumdat-i18n
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-i18n --allow-dirty \
            || echo "eulumdat-i18n already published — continuing"

      - name: Publish eulumdat-quiz
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-quiz --allow-dirty \
            || echo "eulumdat-quiz already published — continuing"

      - name: Publish eulumdat-gltf-pack
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-gltf-pack --allow-dirty \
            || echo "eulumdat-gltf-pack already published — continuing"

      - name: Publish eulumdat-server
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-server --allow-dirty \
            || echo "eulumdat-server already published — continuing"

      - name: Wait for crates.io index update
        run: sleep 30

      # ─── Tier 2: foundation library (only depends on i18n) ───────────
      - name: Publish eulumdat (core library)
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat --allow-dirty \
            || echo "eulumdat already published — continuing"

      - name: Wait for crates.io index update
        run: sleep 45

      # ─── Tier 3: direct eulumdat consumers ───────────────────────────
      - name: Publish eulumdat-photweb
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-photweb --allow-dirty \
            || echo "eulumdat-photweb already published — continuing"

      - name: Publish eulumdat-goniosim
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-goniosim --allow-dirty \
            || echo "eulumdat-goniosim already published — continuing"

      - name: Publish eulumdat-typst
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-typst --allow-dirty \
            || echo "eulumdat-typst already published — continuing"

      - name: Publish eulumdat-ui
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-ui --allow-dirty \
            || echo "eulumdat-ui already published — continuing"

      - name: Publish eulumdat-plugin
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          # WASM-only crate: --no-verify because Linux can't build the
          # `wasm32-unknown-unknown` cdylib in the verify step.
          cargo publish -p eulumdat-plugin --allow-dirty --no-verify \
            || echo "eulumdat-plugin already published — continuing"

      - name: Wait for crates.io index update
        run: sleep 30

      # ─── Tier 4: depend on tier 3 ────────────────────────────────────
      - name: Publish eulumdat-rt
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-rt --allow-dirty \
            || echo "eulumdat-rt already published — continuing"

      - name: Publish eulumdat-ffi
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-ffi --allow-dirty \
            || echo "eulumdat-ffi already published — continuing"

      - name: Publish eulumdat-egui
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-egui --allow-dirty \
            || echo "eulumdat-egui already published — continuing"

      - name: Publish eulumdat-tui
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-tui --allow-dirty \
            || echo "eulumdat-tui already published — continuing"

      - name: Publish eulumdat-tui-quiz
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-tui-quiz --allow-dirty \
            || echo "eulumdat-tui-quiz already published — continuing"

      - name: Publish eulumdat-cli
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-cli --allow-dirty \
            || echo "eulumdat-cli already published — continuing"

      - name: Wait for crates.io index update
        run: sleep 30

      # ─── Tier 5: WASM editor app + Python source uploads + Windows ───
      - name: Publish eulumdat-wasm
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          # Leptos app: --no-verify so the wasm32 cdylib build isn't
          # required on Linux x86_64.
          cargo publish -p eulumdat-wasm --allow-dirty --no-verify \
            || echo "eulumdat-wasm already published — continuing"

      - name: Publish eulumdat-py (source upload)
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          # PyO3 cdylib: --no-verify because verify needs Python linkage.
          # Wheels go to PyPI via .github/workflows/python-publish.yml;
          # this is just the crates.io source upload for completeness.
          cargo publish -p eulumdat-py --allow-dirty --no-verify \
            || echo "eulumdat-py already published — continuing"

      - name: Publish eulumdat-quiz-py (source upload)
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          cargo publish -p eulumdat-quiz-py --allow-dirty --no-verify \
            || echo "eulumdat-quiz-py already published — continuing"

      - name: Publish eulumdat-windows-preview
        env: { CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} }
        run: |
          # Windows-only crate: --no-verify on Linux CI.
          cargo publish -p eulumdat-windows-preview --allow-dirty --no-verify \
            || echo "eulumdat-windows-preview already published — continuing"
