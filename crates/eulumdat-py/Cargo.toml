[package]
name = "eulumdat-py"
version = "0.8.0"  # Must be explicit for maturin (workspace inheritance not supported)
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/holg/eulumdat-rs"
description = "Python bindings for eulumdat photometric file parsing library"

[lib]
name = "eulumdat"
crate-type = ["cdylib"]

[dependencies]
eulumdat = { workspace = true, features = ["xml", "json"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
