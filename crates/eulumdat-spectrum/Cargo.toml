[package]
name = "eulumdat-spectrum"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Spectral power distributions, CIE colorimetry, alpha-opic + mesopic (CIE 191) weighting, D-series daylight reconstruction and Sellmeier dispersion — a dependency-free leaf crate for photometric spectral Monte Carlo"
keywords = ["lighting", "spectrum", "colorimetry", "mesopic", "photometry"]
categories = ["science", "simulation"]

# Deliberately dependency-free (like eulumdat-daylight) so the Monte Carlo
# tracers, the Bevy viewer and the core eulumdat crate can all depend on it
# without any risk of a dependency cycle.
[features]
default = ["std"]
# `std` only picks the inherent f64 math; without it the `math::F64Ext` trait
# supplies sin/exp/log10/... from libm, so the crate builds for bare metal
# (Cortex-M gateways running the same photometry as the browser).
std = ["serde?/std"]
serde = ["dep:serde"]

[dependencies]
# float math on targets whose core has no exp/log10/sqrt/... (see `math` in lib.rs)
libm = "0.2"
serde = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
