[package]
name = "eulumdat-ifc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rooms, luminaires, doors and windows from IFC building models (via bimifc) for the eulumdat lighting designers"
keywords = ["lighting", "ifc", "bim", "photometry", "eulumdat"]
categories = ["science"]

[features]
default = []
# IFC export through bimifc-writer. Needs the local ../bimifc checkout
# (`.cargo/local-siblings.toml`): bimifc-writer 0.2.0 on crates.io has no
# spaces or light fixtures yet. The web build turns it on.
export = ["dep:bimifc-writer"]

[dependencies]
base64.workspace = true
# bimifc: crates.io versions here; local builds take the ../bimifc checkout
# through `.cargo/local-siblings.toml` (see its .example).
bimifc-geometry = "0.3"
bimifc-model = "0.3"
bimifc-parser = "0.3"
bimifc-writer = { version = "0.2", optional = true }
eulumdat.workspace = true

[[example]]
name = "make_sample_ifc"
required-features = ["export"]
