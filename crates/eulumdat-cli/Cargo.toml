[package]
name = "eulumdat-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for EULUMDAT (LDT) and IES photometric files"
readme = "README.md"
keywords = ["eulumdat", "ldt", "ies", "photometry", "lighting"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "eulumdat"
path = "src/main.rs"

[features]
default = []
# Enables the `classify` and `compliance` subcommands (street lighting
# standards: RP-8, EN 13201, CJJ 45, MLO).
street = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
eulumdat = { workspace = true, features = ["xml", "json"] }
eulumdat-digitize.workspace = true
eulumdat-spectrum.workspace = true
eulumdat-tm25.workspace = true
eulumdat-typst.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde_json = "1"
walkdir = "2.5.0"
