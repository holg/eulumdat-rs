[package]
name = "eulumdat-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly Eulumdat (LDT/IES) Editor - Browser-based photometric file editor"
# Strip deploy-time bundle assets, screenshots, and dev test data from
# the published tarball. crates.io has a 10 MiB upload cap; with these
# excluded the package drops from 17.3 MiB to a few hundred KiB.
#
# `src/static/typst/typst_wasm_bg.wasm` (38 MB) and the Bevy JS bundle
# are runtime artifacts loaded by browser code (see typst-loader.js,
# bevy-loader.js) — they're shipped to the WASM `dist/` via
# build-wasm-split.sh, not consumed by Rust source. The IES test file
# under `tests-data/` is only used by the optional benchmark module.
exclude = [
    "src/static/typst/*.wasm",
    "src/static/typst/*.js",
    "src/static/bevy/*",
    "tests-data/**",
    "*.png",
    "*.webarchive",
    "Viso Photometric Editor.webarchive",
]

[package.metadata.bevy_cli.web.release]
wasm-opt = ["-Oz", "-all"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "eulumdat-wasm"
path = "src/main.rs"

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
# `benchmark` exposes the wasm-bindgen perf-measurement module
# (window.runBenchmark*). Disabled by default in published crate because
# it `include_str!`s a 1.3 MB challenging-IES test file that lives in
# this repo's tests-data/ but is excluded from the published tarball
# (would push the package over crates.io's 10 MiB upload cap). The
# build-wasm-split.sh and local dev builds opt in explicitly.
benchmark = []
# Note: the historical `bevy-viewer` feature is gone. The 3D viewer
# now lives in eulumdat-bevy and is lazy-loaded as a separate WASM
# bundle via build-wasm-split.sh (see crates/eulumdat-bevy and the
# bevy-loader.js shim). Embedding it back into eulumdat-wasm via
# cargo features would require eulumdat-bevy on crates.io, which is
# blocked on the upstream Bevy 0.19 photometric proposal merge.

[dependencies]
console_error_panic_hook.workspace = true
# Core library
eulumdat = { workspace = true, features = ["xml", "json", "i18n", "serde"] }
eulumdat-goniosim = { workspace = true, default-features = false }
eulumdat-i18n.workspace = true
eulumdat-rt = { workspace = true, default-features = false }
eulumdat-typst.workspace = true
eulumdat-wasm-templates = { path = "../eulumdat-wasm-templates", version = "0.7.0" }
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo.workspace = true
gloo-file.workspace = true
js-sys.workspace = true

# Web framework (Leptos)
leptos.workspace = true
leptos_router.workspace = true

# WASM bindings
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

# Utilities
base64.workspace = true
serde_json = "1"

# eulumdat-bevy intentionally not declared here — it depends on a
# Bevy git fork (holg/bevy.git#photometric_proposal) that can't publish
# to crates.io. The 3D viewer is shipped as a separate lazy-loaded
# WASM bundle (see scripts/build-wasm-split.sh, bevy-loader.js).

[dependencies.web-sys]
version = "0.3"
features = [
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "DragEvent",
    "DataTransfer",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlAnchorElement",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "WheelEvent",
    "DomRect",
    "console",
    "Navigator",
    "Clipboard",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "Performance",
    "Storage",
    "Location",
    "UrlSearchParams",
    "History",
]

[dev-dependencies]
wasm-bindgen-test.workspace = true

# Optimized web release profile
[profile.web-release]
inherits = "release"
opt-level = 'z'
lto = "fat"
codegen-units = 1
strip = true
debug = false
