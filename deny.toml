[licenses]
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # bzip2 crate (via zip ← ktx2-rw build dep of eulumdat-gltf-pack); BSD-style
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.exceptions]]
allow = ["LicenseRef-UFL-1.0"]
name = "epaint_default_fonts"
version = "*"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

# TODO: fcm-service, how to update?
[[bans.deny]]
name = "openssl-sys"
wrappers = ["openssl", "native-tls"]

[[bans.deny]]
name = "openssl"
use-instead = "rustls"
wrappers = ["rs-firebase-admin-sdk", "native-tls"]

[[bans.deny]]
name = "rustls-webpki"
wrappers = ["rustls"]

[advisories]
ignore = [
  "RUSTSEC-2024-0436",
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained; pulled in only by leptos_macro / leptos_router_macro (compile-time), fix lands with the next leptos release" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via fontdb/usvg/resvg (eulumdat-egui SVG rendering), typst 0.12 and ab_glyph. Waiting for resvg/typst to move" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via usvg (resvg) and typst 0.12, same as ttf-parser" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.4 is updated to a fixed release; the remaining h2 0.3.x is actix-http's (eulumdat-server / eulumdat-dev-server, local static file servers) and has no fixed 0.3 release" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dep via bevy, no action needed" },
  { id = "RUSTSEC-2025-0125", reason = "CVSS:4.0 not yet supported by cargo-deny, tracked separately" },
]
